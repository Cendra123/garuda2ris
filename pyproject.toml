[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "garuda2ris"
version = "0.2.0"
description = "Crawl Garuda (Garba Rujukan Digital) search results and export them as RIS"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cendra Devayana Putra" }]
keywords = ["garuda", "ris", "bibliography", "systematic review", "indonesia"]
dependencies = [
    "requests>=2.25",
    "beautifulsoup4>=4.11",
]

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/garuda2ris"
Issues = "https://github.com/YOUR-USERNAME/garuda2ris/issues"

[project.optional-dependencies]
test = ["pytest", "rispy"]

[project.scripts]
garuda2ris = "garuda2ris.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
